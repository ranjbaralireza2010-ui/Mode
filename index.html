
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STYLE STORE | فروشگاه پوشاک مردانه</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            STYLE <span>STORE</span>
        </div>

        <button class="cart" onclick="toggleCart()">
            🛒 سبد خرید
            (<span id="count">0</span>)
        </button>

    </header>


    <!-- HERO -->
    <section class="hero">

        <h1>استایل خاص، انتخاب خاص</h1>

        <p>
            جدیدترین پوشاک مردانه با طراحی مدرن
        </p>

        <a href="#shop">
            مشاهده محصولات
        </a>

    </section>


    <!-- PRODUCTS -->
    <main class="container" id="shop">

        <h2>محصولات مردانه</h2>

        <div class="controls">

            <input
                type="text"
                id="search"
                placeholder="جستجوی لباس..."
                oninput="render()"
            >

            <select id="category" onchange="render()">

                <option value="all">همه محصولات</option>

                <option value="tshirt">تی‌شرت</option>

                <option value="pants">شلوار</option>

                <option value="hoodie">هودی</option>

                <option value="shoes">کفش</option>

            </select>

        </div>


        <div class="products" id="products"></div>


        <!-- CART -->
        <div id="cartBox">

            <h2>سبد خرید شما</h2>

            <div id="cartItems"></div>

            <h3 id="total"></h3>

            <button class="add" onclick="checkout()">
                ثبت سفارش
            </button>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <h3>STYLE STORE</h3>

        <p>فروشگاه آنلاین پوشاک مردانه</p>

        <p>© 2026 All Rights Reserved</p>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
